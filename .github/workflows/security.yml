name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version
      - name: Scan git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --exit-code 1

  dependency-audit:
    name: pip-audit / ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - projects/osint-toolkit/dns-audit
          - projects/osint-toolkit/exif-map
          - projects/osint-toolkit/osint-mcp
          - projects/osint-toolkit/phone-check
          - projects/osint-toolkit/username-engine
          - projects/ultimate-username-engine/ULTIMATE_USERNAME_ENGINE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and pip-audit
        working-directory: ${{ matrix.project }}
        run: |
          python -m pip install pip-audit
          if [ -f requirements-tested.txt ]; then python -m pip install -r requirements-tested.txt; fi
          python -m pip install -e .
      - name: Audit installed environment
        run: python -m pip_audit --progress-spinner off

  static-analysis:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install bandit
      # B324 is skipped on purpose: SHA-1 (HIBP k-anonymity range API) and MD5 (Gravatar hash)
      # are protocol requirements of those services, not security primitives. See SECURITY.md.
      - name: Fail on high-severity, high-confidence findings
        run: >
          bandit -r projects -x "*/tests/*,*/bench/tests/*"
          --severity-level high --confidence-level high -s B324
