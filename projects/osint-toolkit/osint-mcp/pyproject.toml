[project]
name = "osint-mcp"
version = "0.1.0"
description = "Serwer MCP (FastMCP) nad modulami OSINT repo: dns-audit, phone-check, hibp-monitor, net-intel. Tylko defensywnie, tylko infrastruktura"
requires-python = ">=3.12"
dependencies = ["mcp>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
osint-mcp = "osint_mcp.server:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
