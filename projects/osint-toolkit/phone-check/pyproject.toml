[project]
name = "phone-check"
version = "0.1.0"
description = "Offline walidator numeru telefonu: parsowanie i metadane z planu numeracji (phonenumbers)"
requires-python = ">=3.12"
dependencies = ["phonenumbers>=8.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phone-check = "phone_check.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
