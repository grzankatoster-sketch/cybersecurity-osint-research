[project]
name = "dns-audit"
version = "0.1.0"
description = "Audytor DNS i konfiguracji poczty domeny: SPF, DMARC, DKIM, DNSSEC, MTA-STS, CAA, rekordy weryfikacyjne"
requires-python = ">=3.12"
dependencies = ["dnspython>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dns-audit = "dns_audit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
