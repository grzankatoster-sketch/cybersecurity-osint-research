# Srodowisko OSINT (defensywne). Uruchamiac z katalogu osint-env/.
#   docker compose run --rm toolbox          # powloka w kontenerze
#   docker compose up -d spiderfoot   # (z --profile spiderfoot)
#   docker compose --profile bbot run --rm bbot --help
#   docker compose --profile browser up -d
# Klucz HIBP: tylko ze zmiennej srodowiska hosta (set HIBP_API_KEY=...), nigdy w plikach.
name: osint-env

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 512

services:
  toolbox:
    <<: *hardening
    image: osint-toolbox:latest
    build:
      context: ..                       # katalog OSINT/ (patrz ../.dockerignore)
      dockerfile: osint-env/Dockerfile
      target: runtime
    stdin_open: true
    tty: true
    init: true
    read_only: true
    user: "1000:1000"
    working_dir: /work
    environment:
      HIBP_API_KEY: ${HIBP_API_KEY:-}   # przekazywane z hosta; brak = pusty
      HOME: /home/osint
    volumes:
      - ./work:/work                    # JEDYNY zapisywalny katalog hosta
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/osint:size=64m,uid=1000,gid=1000,mode=0700
    mem_limit: 2g

  # Kontener testowy: docker compose --profile test run --rm selftest
  selftest:
    <<: *hardening
    profiles: ["test"]
    image: osint-toolbox:tests
    build:
      context: ..
      dockerfile: osint-env/Dockerfile
      target: tests
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/osint:size=64m,uid=1000,gid=1000,mode=0700

  spiderfoot:
    <<: *hardening
    profiles: ["spiderfoot"]
    image: spiderfoot:local              # zbudowany wczesniej z narzedzia/spiderfoot-src
    container_name: osint-spiderfoot
    init: true
    read_only: true
    user: "spiderfoot"
    ports:
      - "127.0.0.1:5001:5001"            # tylko localhost, panel bez logowania
    volumes:
      - spiderfoot-data:/var/lib/spiderfoot
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 2g

  bbot:
    <<: *hardening
    profiles: ["bbot"]
    image: blacklanternsecurity/bbot:stable
    init: true
    # bbot dziala jako root w obrazie (HOME=/root); rootfs zapisywalny, bo bbot
    # pobiera zaleznosci modulow. Izolacja: cap_drop ALL, no-new-privileges, wolumen.
    volumes:
      - bbot-data:/root/.bbot
    mem_limit: 3g

  browser:
    <<: *hardening
    profiles: ["browser"]
    # KASM Workspaces: darmowe TYLKO do uzytku niekomercyjnego (zob. README).
    image: kasmweb/firefox:1.16.0
    container_name: osint-browser
    shm_size: "512m"
    ports:
      - "127.0.0.1:6901:6901"            # https://127.0.0.1:6901 , uzytkownik kasm_user
    environment:
      VNC_PW: ${KASM_VNC_PW:-}   # ustaw w srodowisku hosta przed startem (puste = kontener nie wstanie)
    # Obraz kasmweb dziala jako uzytkownik 1000 i wymaga zapisywalnego rootfs.
    cap_drop: [ALL]
    mem_limit: 2g

volumes:
  spiderfoot-data:
  bbot-data:
