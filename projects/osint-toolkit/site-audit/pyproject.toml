[project]
name = "site-audit"
version = "0.1.0"
description = "Audytor strony WWW: przekierowania, TLS, naglowki bezpieczenstwa (HSTS, CSP), ciasteczka, security.txt, robots.txt, sitemap, mieszana tresc"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
site-audit = "site_audit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
